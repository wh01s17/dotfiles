# Restart the screencast portal whenever PipeWire restarts.
#
# xdg-desktop-portal-hyprland connects to PipeWire once at startup and never
# reconnects. After a PipeWire restart (tuning the Mezcla/Compartido nodes,
# say) it keeps the dead connection, so the share picker still opens but every
# stream fails with "Failed to initialize stream: timed out" and Chrome falls
# back to its tab list. PartOf= carries pipewire.service restarts and stops
# over to the portal; After= orders the portal's restart after PipeWire is up.
[Unit]
PartOf=pipewire.service
After=pipewire.service
