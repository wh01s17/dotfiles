# Micrófono virtual "Mezcla" (Audient EVO 8 en perfil "Pro Audio").
#
#   EVO entrada 1 ─┐
#   EVO entrada 2 ─┼─► mezcla.suma ─► Mezcla  (micrófono virtual, mono)
#   Compartido ────┘
#        │
#        └─► salida seleccionada
#
# "Compartido" es una salida virtual: lo que suena ahí se escucha por la salida
# seleccionada y además entra en la Mezcla.
#
# Los puentes con destino fijo usan dont-fallback + linger: si su destino
# desaparece (la EVO se desconecta un instante), esperan y se reconectan solos
# cuando vuelve, en vez de pasarse a otro dispositivo o destruirse.
#
# Volumen de cada parte en la mezcla ("Gain N"):
#   1 = entrada 1, 2 = entrada 2, 3/4 = Compartido L/R.

context.modules = [
    # Sumador: sink interno de 4 canales que sale como micrófono mono.
    # Canales: FL/FR = entradas 1-2, RL/RR = Compartido L/R. (Posiciones
    # estándar: con AUX0/AUX1 el sink entregaba silencio en esos canales.)
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Mezcla (suma interna)"
            media.name       = "Mezcla"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = mix
                        label   = mixer
                        control = { "Gain 1" = 1.0  "Gain 2" = 1.0  "Gain 3" = 0.5  "Gain 4" = 0.5 }
                    }
                ]
                inputs  = [ "mix:In 1" "mix:In 2" "mix:In 3" "mix:In 4" ]
                outputs = [ "mix:Out" ]
            }
            capture.props = {
                node.name        = "mezcla.suma"
                media.class      = Audio/Sink
                audio.position   = [ FL FR RL RR ]
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "Mezcla"
                node.description = "Mezcla (entradas 1-2 + Compartido)"
                media.class      = Audio/Source
                audio.position   = [ MONO ]
            }
        }
    }

    # EVO entradas 1-2 → sumador.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Mezcla: entradas 1-2"
            capture.props = {
                node.name           = "mezcla.entradas"
                audio.position      = [ AUX0 AUX1 ]
                target.object       = "alsa_input.usb-Audient_EVO8-00.pro-input-0"
                stream.dont-remix   = true
                node.passive        = true
                node.dont-fallback  = true
                node.linger         = true
            }
            playback.props = {
                node.name           = "mezcla.entradas.out"
                audio.position      = [ FL FR ]
                target.object       = "mezcla.suma"
                stream.dont-remix   = true
                node.dont-fallback  = true
                node.linger         = true
            }
        }
    }

    # Salida virtual "Compartido" → salida seleccionada (sin target fijo: sigue
    # a la salida por defecto como cualquier app).
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Compartido"
            capture.props = {
                node.name        = "Compartido"
                node.description = "Compartido"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "mezcla.compartido.escucha"
                node.description = "Compartido (escucha)"
                audio.position   = [ FL FR ]
            }
        }
    }

    # Lo que suena en "Compartido" → sumador.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Mezcla: Compartido"
            capture.props = {
                node.name           = "mezcla.compartido"
                audio.position      = [ FL FR ]
                target.object       = "Compartido"
                stream.capture.sink = true
                stream.dont-remix   = true
                node.passive        = true
                node.dont-fallback  = true
                node.linger         = true
            }
            playback.props = {
                node.name           = "mezcla.compartido.out"
                audio.position      = [ RL RR ]
                target.object       = "mezcla.suma"
                stream.dont-remix   = true
                node.dont-fallback  = true
                node.linger         = true
            }
        }
    }
]
