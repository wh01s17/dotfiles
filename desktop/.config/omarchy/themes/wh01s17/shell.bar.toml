[bar]
background       = "#11161a"
background-alpha = 0.96
text             = "#cbd5ce"
active           = "#ff6b66"
scale-with-font  = true
size-horizontal  = 36
size-vertical    = 32
# The bar outline (shell.json bar.outline or bar.islands) takes the windows' active border.
border           = "hyprland.active-border-foreground"
border-alpha     = 0.55
