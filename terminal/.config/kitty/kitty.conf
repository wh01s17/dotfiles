# Follow the active Omarchy theme generated by Quattro.
include ~/.local/state/omarchy/current/theme/kitty.conf

font_family      MesloLGS Nerd Font Mono
bold_font        MesloLGS Nerd Font Mono Bold
italic_font      MesloLGS Nerd Font Mono Italic
bold_italic_font MesloLGS Nerd Font Mono Bold Italic

font_size 9.0
background_opacity 0.85

# Padding horizontal (izquierda y derecha)
window_padding_width 10

# Padding vertical (arriba y abajo)
window_padding_height 10

# Tab style
tab_bar_margin_width      9
tab_bar_margin_height     9 0
tab_bar_style             separator
tab_bar_min_tabs          1
tab_separator             ""

tab_title_template        "{fmt.fg._5c6370}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._5c6370}{index} ⌘ {title[:15] + (title[15:] and '…')}{fmt.fg._5c6370}{fmt.bg.default} "


active_tab_title_template "{fmt.fg._33ccff}{fmt.bg.default}{fmt.fg._282c34}{fmt.bg._33ccff}{index} ⌘ {fmt.noitalic}{title[:100] + (title[100:] and '…')}{fmt.fg._33ccff}{fmt.bg.default} "

shell /usr/bin/zsh

# resize key shortcuts
map ctrl+left  resize_window narrower
map ctrl+right resize_window wider
map ctrl+up    resize_window taller
map ctrl+down  resize_window shorter

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow cwd lookup and live terminal integration from Omarchy.
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
