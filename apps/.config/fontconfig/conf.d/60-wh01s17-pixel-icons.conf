<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The shell draws text in Departure Mono, which has no icons. Glyphs it lacks
  fall back to wh01s17 Pixel Icons (Pixelarticons at Nerd Font code points,
  built by the theme's sources/pixel-icons.py) and then to Symbols Nerd Font
  for any icon that has no pixel counterpart yet.
-->
<fontconfig>
  <alias binding="strong">
    <family>Departure Mono</family>
    <accept>
      <family>wh01s17 Pixel Icons</family>
      <family>Symbols Nerd Font</family>
    </accept>
  </alias>
</fontconfig>
